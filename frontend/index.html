<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Donate Plaza · Stellar Testnet</title>
<link rel="stylesheet" href="./src/style.css"></head>
<body><main><header class="app-header"><div><span class="eyebrow">SOROBAN · TESTNET</span><h1>Donate Plaza</h1><p>Elige un cartel, conecta tu wallet y deja un mensaje on-chain.</p></div><button id="connect" type="button">Conectar Freighter</button></header>
<section class="config"><label>Gateway contract <input id="gateway" placeholder="C..."></label><label>RPC <input id="rpc" value="https://soroban-testnet.stellar.org"></label><label>Filtrar historial<select id="history-filter"><option value="all">Todas las donaciones</option><option value="sign">Por cartel</option><option value="donor">Por donante</option></select></label><label id="filter-value-wrap" class="hidden">Valor<input id="filter-value" placeholder="ID del cartel o dirección G..."></label></section>
<div id="status" class="status" role="status" aria-live="polite">Configura el contrato desplegado para comenzar.</div>
<section class="plaza-3d-section" aria-label="Plaza 3D interactiva">
  <div class="plaza-3d-heading"><div><span class="tag">PLAZA 3D</span><h2>Recorre los puestos</h2></div><p>Arrastra para girar · rueda para acercar · clic en un cartel para donar</p></div>
  <div id="plaza-viewport"><canvas id="plaza-canvas"></canvas><div id="plaza-tooltip" class="plaza-tooltip" hidden></div></div>
</section>
<section id="signs" class="plaza" aria-label="Carteles disponibles"></section><section class="history-section"><h2>Últimas donaciones</h2><div id="history" class="history"></div></section></main><dialog id="donate"><form method="dialog"><h2 id="dialog-title">Donar</h2><input type="hidden" id="sign-id"><label class="dialog-field">Monto (unidades base)<input id="amount" type="number" min="1" required></label><p id="custom-range" class="range"></p><label class="dialog-field">Mensaje (opcional)<textarea id="message" maxlength="180"></textarea></label><div class="actions"><button type="button" value="cancel" id="cancel-donation">Cancelar</button><button type="submit" id="submit-donation" value="default">Firmar donación</button></div></form></dialog><script type="module" src="./src/main.js"></script></body></html>
